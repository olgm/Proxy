name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: proxyd and probed stay stdlib-only
        run: |
          deps="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./cmd/proxyd ./cmd/probed)"
          bad="$(echo "$deps" | grep -v '^github.com/olgm/proxy/' || true)"
          if [ -n "$bad" ]; then
            echo "cmd/proxyd and cmd/probed must stay stdlib-only; found:"
            echo "$bad"
            exit 1
          fi
